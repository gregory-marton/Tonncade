# Ortho Glider Eta — a flyer glider under the Ortho2/S2 isotropy-aware rule.
# Born on exactly 2 neighbours in ortho (adjacent-pair) arrangement;
# survive on exactly 2 neighbours. This 6-cell pattern emits a glider
# every 3 generations with perfect regularity (constant period).
# Discovered by computational search (life_helpers/build_glider_v2.js).
# Verified: 34 emissions in 100 generations, period exactly 3.
# See docs/life-rules.md for the full rule language.
name: "Ortho Glider Eta"
description: "A 6-cell flyer glider: emits gliders every 3 generations under the Ortho2/S2 rule."
rule:
  birth:
    - ring_count: [2]
      isotropy: [ortho]
  survival: [2]
sound: { when: born, duration: 0.35 }
initial:
  cells:
    - [0, 0]
    - [-1, 1]
    - [1, -1]
    - [-2, 1]
    - [0, 1]
    - [-3, 1]
tempo: 240
