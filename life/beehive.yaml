# Beehive rule — a 3-state totalistic hexagonal cellular automaton with a known glider.
#
# States: 0 = empty, 1 = "head", 2 = "tail". A cell's next state is looked up in the transition
# table `transition` by the counts of its 6 consonant ring-neighbours in states 1 and 2. This file
# uses index order "21": next = transition[count_of_state_2][count_of_state_1].
#
# The matrix and the period-1 glider below are from:
#   Adamatzky, Wuensche & De Lacy Costello, "Glider-based computing in reaction-diffusion
#   hexagonal cellular automata", Chaos, Solitons & Fractals 27 (2006) 287–295 (the "beehive"
#   rule; see Fig. of the mobile glider). Cross-referenced with Andrew Wuensche's beehive-rule
#   work in Discrete Dynamics Lab (DDLab). The index order and glider seed here were verified by
#   simulation against that glider (see tests/desktop.spec.js "Life multi-state (beehive)…").
#
# See docs/life-rules.md for the full rule language.
name: "Beehive"
description: "Wuensche's 3-state hexagonal beehive rule — carries a small gliding pattern."
states: 3
order: "21"
transition:
  - [0, 1, 2, 1, 2, 0, 0]
  - [0, 2, 2, 2, 1, 1]
  - [0, 0, 2, 2, 0]
  - [0, 2, 2, 0]
  - [0, 0, 2]
  - [2, 0]
  - [0]
# Every cell sounds its own getMidi(p,q) pitch (the Tonnetz invariant). State only varies timbre:
# heads (state 1) speak brightly and briefly; tails (state 2) linger a touch softer and longer.
sound: { when: born, duration: 0.4 }
sounds:
  - { state: 1, velocity: 95, duration: 0.35 }
  - { state: 2, velocity: 55, duration: 0.7 }
initial:
  cells:
    - [1, 1, 2]
    - [2, 1, 2]
    - [0, 2, 1]
    - [0, 3, 2]
    - [1, 3, 2]
tempo: 180
