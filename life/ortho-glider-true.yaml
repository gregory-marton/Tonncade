# Ortho Glider True (Stationary) — a TRUE flyer glider under the Ortho2/S2 rule.
# Unlike previous drifting puffers, this has a stationary oscillating core that periodically sheds gliders.
# Born on exactly 2 neighbours in ortho (adjacent-pair) arrangement; survive on exactly 2.
name: "Ortho Glider True"
description: "A stationary 9-cell oscillator glider that periodically emits small gliders under the Ortho2/S2 rule."
rule:
  birth:
    - ring_count: [2]
      isotropy: [ortho]
  survival: [2]
sound: { when: born, duration: 0.35 }
initial:
  cells:
    - [0, 0]
    - [0, -1]
    - [-1, -1]
    - [-1, 0]
    - [-2, 0]
    - [-1, -2]
    - [-1, -3]
    - [1, -2]
    - [-2, -2]
tempo: 240
